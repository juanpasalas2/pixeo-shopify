# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "07c74a0cb8d4ab2649724c176929b081"
name = "pixeo"
application_url = "https://pixeo-app.onrender.com"
embedded = true

[webhooks]
api_version = "2026-01"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
uri = "/webhooks/privacy"


[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,read_themes,write_products,write_themes"

[auth]
redirect_urls = [
  "https://pixeo-app.onrender.com/auth/callback",
  "https://pixeo-app.onrender.com/auth/shopify/callback",
  "https://pixeo-app.onrender.com/api/auth/callback"
]

[build]
automatically_update_urls_on_dev = true
